name: Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build disposable CI debug APK
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web build dependencies
        run: npm ci

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          if (-not $sdkRoot) { throw "ANDROID_HOME and ANDROID_SDK_ROOT are not set on the runner." }
          if (-not (Test-Path -LiteralPath $sdkRoot)) { throw "Android SDK root does not exist: $sdkRoot" }

          $sdkManager = Get-ChildItem -LiteralPath $sdkRoot -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under $sdkRoot" }

          $licenseInput = "y`n" * 100
          $licenseInput | & $sdkManager --sdk_root=$sdkRoot --licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $sdkManager --sdk_root=$sdkRoot "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHINE_AAC_SDK_ROOT=$sdkRoot"

      - name: Build and test disposable CI debug APK
        shell: pwsh
        run: .\build-test.bat -SdkDir $env:SHINE_AAC_SDK_ROOT

      - name: Upload disposable CI debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shine-aac-ci-debug-apk-do-not-distribute
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
