name: Android

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Test and build debug APK
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build versioned debug APK
        shell: pwsh
        run: .\package-release.bat -SetupSdk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shine-aac-debug-apk
          path: releases/**/shine-aac-*-debug.apk

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: shine-aac-release-metadata
          path: |
            releases/**/SHA256SUMS.txt
            releases/**/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Get-ChildItem -LiteralPath releases -Directory | Select-Object -First 1
          if (-not $releaseDir) { throw "No release directory found." }
          $notes = Join-Path $releaseDir.FullName "RELEASE_NOTES.md"
          $apk = Get-ChildItem -LiteralPath $releaseDir.FullName -Filter "*.apk" | Select-Object -First 1
          $sha = Get-ChildItem -LiteralPath $releaseDir.FullName -Filter "SHA256SUMS.txt" | Select-Object -First 1
          if (-not $apk) { throw "No APK found in $($releaseDir.FullName)." }
          if (-not $sha) { throw "No SHA256SUMS.txt found in $($releaseDir.FullName)." }
          gh release create "${{ github.ref_name }}" $apk.FullName $sha.FullName --title "SHINE AAC ${{ github.ref_name }}" --notes-file $notes
