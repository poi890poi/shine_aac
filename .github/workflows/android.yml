name: Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Test and build debug APK
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web build dependencies
        run: npm ci

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          if (-not $sdkRoot) { throw "ANDROID_HOME and ANDROID_SDK_ROOT are not set on the runner." }
          if (-not (Test-Path -LiteralPath $sdkRoot)) { throw "Android SDK root does not exist: $sdkRoot" }

          $sdkManager = Get-ChildItem -LiteralPath $sdkRoot -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under $sdkRoot" }

          $licenseInput = "y`n" * 100
          $licenseInput | & $sdkManager --sdk_root=$sdkRoot --licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $sdkManager --sdk_root=$sdkRoot "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHINE_AAC_SDK_ROOT=$sdkRoot"

      - name: Build versioned debug APK
        shell: pwsh
        run: .\package-release.bat -SdkDir $env:SHINE_AAC_SDK_ROOT

      - name: Package release ZIP
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -LiteralPath .artifacts\releases -Directory | Select-Object -First 1
          if (-not $releaseDir) { throw "No release directory found." }
          $apk = Get-ChildItem -LiteralPath $releaseDir.FullName -Filter "*-debug.apk" | Select-Object -First 1
          $sha = Join-Path $releaseDir.FullName "SHA256SUMS.txt"
          $notes = Join-Path $releaseDir.FullName "RELEASE_NOTES.md"
          if (-not $apk) { throw "No debug APK found in $($releaseDir.FullName)." }
          $zip = Join-Path $releaseDir.FullName ($apk.BaseName + ".zip")
          Compress-Archive -LiteralPath $apk.FullName, $sha, $notes -DestinationPath $zip -CompressionLevel Optimal -Force

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shine-aac-debug-apk
          path: .artifacts/releases/**/shine-aac-*-debug.apk

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: shine-aac-release-metadata
          path: |
            .artifacts/releases/**/SHA256SUMS.txt
            .artifacts/releases/**/RELEASE_NOTES.md

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shine-aac-release-zip
          path: .artifacts/releases/**/*-debug.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Get-ChildItem -LiteralPath .artifacts\releases -Directory | Select-Object -First 1
          if (-not $releaseDir) { throw "No release directory found." }
          $notes = Join-Path $releaseDir.FullName "RELEASE_NOTES.md"
          $apk = Get-ChildItem -LiteralPath $releaseDir.FullName -Filter "*.apk" | Select-Object -First 1
          $zip = Get-ChildItem -LiteralPath $releaseDir.FullName -Filter "*-debug.zip" | Select-Object -First 1
          $sha = Get-ChildItem -LiteralPath $releaseDir.FullName -Filter "SHA256SUMS.txt" | Select-Object -First 1
          if (-not $apk) { throw "No APK found in $($releaseDir.FullName)." }
          if (-not $zip) { throw "No ZIP found in $($releaseDir.FullName)." }
          if (-not $sha) { throw "No SHA256SUMS.txt found in $($releaseDir.FullName)." }
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $apk.FullName $zip.FullName $sha.FullName --clobber
            gh release edit "${{ github.ref_name }}" --title "SHINE AAC ${{ github.ref_name }}" --notes-file $notes
          } else {
            gh release create "${{ github.ref_name }}" $apk.FullName $zip.FullName $sha.FullName --title "SHINE AAC ${{ github.ref_name }}" --notes-file $notes
          }
