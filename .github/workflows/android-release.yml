name: Publish AAC APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          release_dir="releases/${tag}"
          apk="$(find "${release_dir}" -maxdepth 1 -name "*.apk" -print -quit)"
          zip="$(find "${release_dir}" -maxdepth 1 -name "*.zip" -print -quit)"
          notes="${release_dir}/RELEASE_NOTES.md"
          sums="${release_dir}/SHA256SUMS.txt"

          if [[ -z "${apk}" ]]; then
            echo "No APK found in ${release_dir}" >&2
            exit 1
          fi

          assets=("${apk}" "${sums}" "${notes}")
          if [[ -n "${zip}" ]]; then
            assets=("${apk}" "${zip}" "${sums}" "${notes}")
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --title "SHINE AAC ${tag}" \
              --notes-file "${notes}"
          fi
